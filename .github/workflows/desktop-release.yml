name: Windows desktop release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x86-64
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Set bundle version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
            throw 'Release tags must look like v1.2.3 or v1.2.3-beta.1'
          }
          $file = 'desktop\src-tauri\tauri.conf.json'
          $config = Get-Content -Raw $file | ConvertFrom-Json
          $config.version = $version
          $json = $config | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText(
            $file,
            $json + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Cache Cargo downloads and compiled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/.build
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'scripts/build-ffmpeg.sh') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ runner.arch }}-

      - name: Install MSYS2 FFmpeg toolchain
        run: |
          $roots = @('C:\msys64', 'C:\tools\msys64')
          $root = $roots | Where-Object { Test-Path (Join-Path $_ 'usr\bin\bash.exe') } | Select-Object -First 1
          if (-not $root) {
            choco install msys2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install MSYS2 ($LASTEXITCODE)" }
            $root = $roots | Where-Object { Test-Path (Join-Path $_ 'usr\bin\bash.exe') } | Select-Object -First 1
          }
          if (-not $root) { throw 'MSYS2 was installed but its bash executable was not found.' }
          "MSYS2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bash = Join-Path $root 'usr\bin\bash.exe'
          & $bash -lc 'pacman -Sy --needed --noconfirm make diffutils curl tar xz python mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 package installation failed ($LASTEXITCODE)" }

      - name: Build Windows bundle
        run: .\build.ps1 --install-deps --bundles nsis --jobs 2

      - name: Upload Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr0former-windows-x86_64
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr0former-windows-x86_64
          path: release-assets

      - name: Create or refresh prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-assets/*-setup.exe)
          if (( ${#files[@]} == 0 )); then
            echo "No Windows installer was downloaded." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --prerelease --verify-tag --generate-notes --title "pr0former $GITHUB_REF_NAME"
          fi
