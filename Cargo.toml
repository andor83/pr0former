[workspace]
members = ["crates/core", "crates/dsp", "crates/server", "plugins/gain"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pr0-core = { path = "crates/core" }
pr0-dsp = { path = "crates/dsp" }

