[package]
name = "pr0former-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
mdns-sd = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURLCredential", "NSURLAuthenticationChallenge", "NSURLProtectionSpace"] }
