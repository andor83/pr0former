<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect to pr0former Server</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#171b21;color:#dde5ee}body{margin:0;padding:28px}h1{font-size:23px;color:#5bd6dd;margin:0 0 18px}label{display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #59636f;border-radius:6px;background:#20262e;color:inherit;font:inherit}p{line-height:1.5;color:#bac5d2}button{min-height:44px;padding:10px 20px;border:0;border-radius:6px;background:#5bd6dd;color:#142025;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:2px solid #b39bf4;outline-offset:3px}[role=alert]{color:#ffbb76;min-height:1.5em;margin:10px 0}
</style><script src="connect.js" defer></script></head>
<body><h1>Connect to Server</h1><form id="connect-form"><label for="address">pr0former server address</label><input id="address" name="address" type="url" placeholder="https://studio.local:8443" required autofocus spellcheck="false" autocomplete="url"><p>Opens a separate session. Sign in with your account on that server. For local audio capture, use trusted HTTPS or localhost.</p><p id="error" role="alert"></p><section id="certificate" hidden><p id="certificate-origin"></p><p>SHA-256 fingerprint</p><p id="fingerprint" style="font:12px monospace;overflow-wrap:anywhere;user-select:all"></p><button id="trust" type="button">Trust This Server</button><p>Trust applies only to this server in pr0former. A changed certificate requires approval again.</p></section><button id="connect" type="submit">Connect</button></form></body></html>
